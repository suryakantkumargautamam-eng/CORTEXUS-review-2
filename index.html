<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORTEXUS Review Generator</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(135deg, #e3f2fd, #f4f6f9);
  padding: 20px;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
  max-width: 420px;
  margin: auto;
}

.brand {
  font-weight: bold;
  color: #1565c0;
  margin-bottom: 10px;
}

h2 { color: #333; }

input {
  padding: 10px;
  width: 90%;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

#review {
  margin: 20px 0;
  font-size: 16px;
  min-height: 100px;
  background: #f1f8ff;
  padding: 12px;
  border-radius: 10px;
}

button {
  padding: 12px 18px;
  margin: 8px;
  font-size: 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.generate { background: #4CAF50; color: white; }
.copy { background: #2196F3; color: white; }

.note {
  font-size: 13px;
  color: gray;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="brand">CORTEXUS - Advanced Neuro Rehabilitation</div>

<h2>⭐ Leave a Review</h2>

<input type="text" id="name" placeholder="Enter your name (optional)">

<div id="review">Click Generate Review</div>

<button class="generate" onclick="generateReview()">Generate Review</button>
<br>
<button class="copy" onclick="copyAndOpen()">Copy & Open Google</button>

<div class="note">
Review copy hoga aur Google page open ho jayega
</div>

</div>

<script>

let reviews = [
"Excellent physiotherapy service at CORTEXUS. Highly recommended.",
"Very professional treatment at CORTEXUS clinic.",
"Great experience. Pain relief was quick.",
"Clean clinic and friendly staff.",
"Highly satisfied with the therapy.",
"I had a great experience at CORTEXUS. The therapist is very knowledgeable and supportive.",
"One of the best physiotherapy clinics.",
"Very clean and well-maintained clinic.",
"Fast recovery from pain.",
"Best neuro rehabilitation clinic in Gomti Nagar.",
"Highly skilled therapist.",
"Very effective treatment for back pain.",
"Professional physiotherapy services.",
"Highly recommended for nerve pain.",
"Great care and support."
];

let used = [];

function generateReview() {

  if (used.length === reviews.length) {
    used = [];
  }

  let i;
  do {
    i = Math.floor(Math.random() * reviews.length);
  } while (used.includes(i));

  used.push(i);

  let name = document.getElementById("name").value.trim();
  let reviewText = reviews[i];

  if(name !== ""){
    reviewText = "I, " + name + ", had a great experience. " + reviewText;
  }

  document.getElementById("review").innerText = "⭐⭐⭐⭐⭐ " + reviewText;
}

function copyAndOpen() {

  let text = document.getElementById("review").innerText;

  if(text === "Click Generate Review"){
    alert("Please generate a review first");
    return;
  }

  navigator.clipboard.writeText(text);

  setTimeout(function() {
    window.open("https://maps.app.goo.gl/xtfqFHcmeHyK5LvJ6", "_blank");
  }, 300);
}

</script>

</body>
</html>
